# Dogzilla S2 robot image: Raspberry Pi 5, headless ROS 2 Jazzy + Qt 6.12.
#
# Build with:
#   kas build meta-dogzilla/kas/dogzilla-raspberrypi5-jazzy.yml
#
# This reuses the shared kas includes from the meta-ros "build" branch and adds
# the meta-dogzilla layer on top, so it does not modify upstream meta-ros.

header:
  version: 14
  includes:
    - repo: meta-ros
      file: kas/yocto/whinlatter.yml
    - repo: meta-ros
      file: kas/ros2/jazzy.yml
    - repo: meta-ros
      file: kas/machine/raspberrypi5.yml
    - repo: meta-ros
      file: kas/common.yml
    - repo: meta-ros
      file: kas/systemd.yml
    - repo: meta-ros
      file: kas/layer/qt6.yml

repos:
  # meta-ros "build" branch: source of the shared kas includes above. It is not
  # itself a bitbake layer, so disable its (nonexistent) root layer to avoid
  # bitbake trying to load meta-ros/conf/layer.conf.
  meta-ros:
    url: "https://github.com/ros/meta-ros.git"
    branch: "build"
    layers:
      "": "disabled"

  # This repo. Provides ros-image-dogzilla, the qtgamepad port and the
  # qt-ros2-bridge recipe. No url => kas uses this local checkout in place.
  meta-dogzilla:

  # Override qt6 (defined at 6.10.3 in kas/layer/qt6.yml) to the 6.12
  # pre-release branch.
  qt6:
    branch: "6.12"

  zenoh:
    branch: "master"
    commit: 1a3815e26f3c54f577651ca504e1bc49e731bf18

target:
  - ros-image-dogzilla

local_conf_header:
  dogzilla: |
    # Harden root: meta-ros' common.yml enables empty-root-password +
    # allow-empty-password + allow-root-login (passwordless root ssh, a dev
    # convenience). Drop them now that the pi user (key + NOPASSWD sudo) is the
    # login path: root ends up with no usable password and sshd won't accept
    # root, so access is pi-key -> sudo. (post-install-logging is kept.)
    IMAGE_FEATURES:remove = "empty-root-password allow-empty-password allow-root-login"

    # Headless robot: only daemons run, so no window system.
    DISTRO_FEATURES:remove = "x11 wayland"

    # Enable Wi-Fi support distro-wide. Without this, NetworkManager is built
    # with no wifi backend (its PACKAGECONFIG wifi is gated on this feature),
    # so nmcli reports "plugin missing" for every wireless device.
    DISTRO_FEATURES:append = " wifi"

    # Enable the PulseAudio client backend in QtMultimedia (its backend is
    # pulseaudio when this feature is set, else bare alsa). We run PipeWire with
    # its pulse-compat server (pipewire-pulse), so Qt audio + Qt Speech route
    # through PipeWire for mixing/volume. We do NOT install the PulseAudio server.
    DISTRO_FEATURES:append = " pulseaudio"

    # mDNS name: robot is reachable at dogzilla.local via avahi (handy for the
    # direct-cable/link-local demo case). Rename to taste.
    hostname:pn-base-files = "dogzilla"

    # Drop PipeWire's libcamera plugin (audio-only for now; v4l2 stays). It pulls
    # libcamera, and meta-ros-common ships its own libcamera_0.5.2 that shadows
    # oe-core's but lacks the "raspberrypi" PACKAGECONFIG that meta-raspberrypi's
    # bbappend appends -> fatal QA. Revisit when adding camera/vision support
    # (BBMASK the meta-ros libcamera to use oe-core's, or define that PACKAGECONFIG).
    PACKAGECONFIG:remove:pn-pipewire = "libcamera"

    # Use QtMultimedia's ffmpeg backend (Qt's recommended default), which does
    # V4L2 camera capture itself -- so the USB webcam works via QCamera with no
    # gstreamer plugins. Removing gstreamer makes ffmpeg the default backend.
    PACKAGECONFIG:remove:pn-qtmultimedia = "gstreamer"

    # NOTE: on-target Qt app building was attempted via QT_FORCE_BUILD_TOOLS
    # (build moc/rcc/uic/qmltyperegistrar for the target). It does NOT work here:
    # forcing target Qt tools makes the image's own QML modules (qtgamepad,
    # qt-ros2-bridge, qtmultimedia) grab the aarch64 tool during their *cross*
    # build -> "cannot execute binary file: Exec format error". It fights Qt's
    # cross design. Build dogzillad with the Yocto SDK instead (populate_sdk) and
    # deploy over ssh -- see README. cmake + qtbase-tools stay in the image for
    # plain-CMake/qmake use, but Qt find_package needs the SDK's host tools.

    # Many ROS/ament packages embed the build prefix in their generated
    # <pkg>Config.cmake / ament-index files. whinlatter oe-core promoted the
    # "buildpaths" QA check to a fatal error; downgrade it to a warning so the
    # ROS stack packages. (Acceptable here: this is a device image, not a
    # redistributed reproducible-build product.)
    ERROR_QA:remove = "buildpaths"
    WARN_QA:append = " buildpaths"

    # meta-ros2's dynamic meta-qt6 layer ships a python3-pyqt6 bbappend, but no
    # layer here provides the python3-pyqt6 recipe (it comes from a PyQt6 layer
    # we don't use, and we don't need PyQt6). Mask the dangling bbappend so
    # bitbake doesn't fail with "No recipes available for ...python3-pyqt6".
    BBMASK += "dynamic-layers/meta-qt6/recipes-python/pyqt6/"

    # NetworkManager owns ethernet/wifi (it manages any interface not claimed
    # by another tool). We don't install systemd-networkd config, so NM handles
    # the handoff. Robot-specific connection profiles belong in the
    # meta-dogzilla layer (recipes-connectivity) once defined.
    #
    # meta-ros installs ${ROS_CONNECTION_MANAGER} (default: connman) into the
    # image. connman conflicts with networkmanager, so point it at NM instead.
    ROS_CONNECTION_MANAGER = "networkmanager"
    # Belt-and-suspenders: also ignore connman if something recommends it.
    BAD_RECOMMENDATIONS += "connman"
