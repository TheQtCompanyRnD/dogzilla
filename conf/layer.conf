# Layer configuration for meta-dogzilla
# Yocto layer for the Dogzilla S2 robot (Raspberry Pi 5, headless ROS 2 + Qt 6).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "dogzilla"
BBFILE_PATTERN_dogzilla = "^${LAYERDIR}/"
BBFILE_PRIORITY_dogzilla = "20"

# meta-ros-common (ros-common-layer) is only compat-tagged for whinlatter,
# so keep this layer aligned with it.
LAYERSERIES_COMPAT_dogzilla = "whinlatter"

LAYERDEPENDS_dogzilla = "core openembedded-layer networking-layer qt6-layer ros-common-layer raspberrypi"

# The dogzilla repo feeds four recipes (its dogzillad/, dogzilla_interfaces/,
# oledd/ and services/ subdirs), so its revision is pinned once here rather
# than four times over. Bump DOGZILLA_SRCREV to pick up new commits; to track
# the branch head while developing, set
#   SRCREV:pn-dogzillad = "${AUTOREV}"
# in local.conf (or use `devtool modify` for live working-tree iteration).
DOGZILLA_GIT_REPO ?= "github.com/TheQtCompanyRnD/dogzilla"
DOGZILLA_SRCREV ?= "396be10f379131e6514b9f93e96964d4e4d9d7c8"

# Qt ROS. Only one recipe builds it, so its SRCREV lives
# in the recipe alongside the branch it needs.
QTROS_GIT_REPO ?= "github.com/TheQtCompanyRnD/qtros"
