# systemd-networkd owns the wired interface on this image (see
# /etc/systemd/network/80-wired.network). Without this NetworkManager runs its
# own DHCP client on eth0 as well: the two race, and NM's failed activations
# tear down the address that was just configured -- which is what made a
# direct-cable link come and go. NM still owns wlan0, so nmtui adds venue wifi
# the usual way.
[keyfile]
unmanaged-devices=interface-name:eth0
