# slam_toolbox parameters for the Dogzilla (async mapping mode). Wildcard node
# key so the file works whatever namespace the node runs in; scan_topic and
# map_name are set by slam_toolbox.launch.py.
/**:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames: same chain as the Cartographer config. base_link is also the
    # tracking frame; scans arrive in laser_frame (static TF from dogzillad).
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    mode: mapping # or "localization" to run against a saved map (map_file_name)
    use_map_saver: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05 # map->odom at 20 Hz
    map_update_interval: 1.0       # matches publish_period_sec in cartographer.launch.py
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.15
    max_laser_range: 12.0
    minimum_time_interval: 0.2     # rate-limit by time: the travel gates below are off
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000    # needed to serialize large maps
    enable_interactive_mode: false # only the RViz interactive plugin needs it

    # General parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # The odom frame is a fixed identity (no odometry), so "distance/heading
    # travelled since the last scan" is always 0. Zero the gates or no scan after
    # the first would ever be processed.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation parameters. No motion prior from odometry, so the window must
    # cover the motion between processed scans (wider than slam_toolbox's 0.5 m
    # default would be needed for fast travel; the dog is slow).
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
